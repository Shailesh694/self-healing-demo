name: CI with Autonomous Self-Healing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  heal-and-remediate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies & Scanners
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pip-audit google-genai
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Scan Code Quality (Flake8)
        id: flake8_scan
        continue-on-error: true
        run: |
          python -m flake8 main.py --output-file=linter_errors.log || true

      - name: Scan Dependencies (pip-audit)
        id: audit_scan
        continue-on-error: true
        run: |
          python -m pip_audit -r requirements.txt > cve_errors.log || true

      - name: Run SelfHeal Engine (diagnose, candidate, sandbox, regression, apply)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SELFHEAL_GEMINI_ENABLED: "true"
          SELFHEAL_SANDBOX_TIMEOUT: "600"
          SELFHEAL_TEST_TARGET: "sample_tests"
        run: |
          python heal.py

      - name: Verify remediation (engine tests must pass before PR)
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - name: Create Self-Healing Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(ai): automated code remediation & CVE patch"
          title: "🤖 Automated CI Self-Healing Remediation"
          body: |
            ### SelfHeal engine report
            Every change passed validation, risk/policy, sandbox and regression
            gates in the SelfHeal engine, then post-repair tests, before this PR.
            Please review before merging.
          branch: auto-heal/ci-patch
          delete-branch: true